# Baselines with the original ACT (third_party/act, unmodified; adapter: src/action_free/act_original.py).
# Values follow the ACT README command for sim_transfer_cube_scripted, except where noted.

data_dir = "data/source-n300-seed0"   # source collection; the launcher's --num-episodes sets N
num_episodes = 300                    # R2 (docs/experiments/act_baseline_a.md); sweeps override it
exclude_detours = false               # true: drop demos with deliberate expert detours

num_epochs = 2000      # README value (one epoch = one sampled step per training episode)
batch_size = 8
lr = 1e-5
kl_weight = 10
chunk_size = 20        # README: 100 at 50 Hz = 2 s; same 2 s horizon at our 10 Hz
hidden_dim = 512
dim_feedforward = 3200
# Fixed in upstream code: ResNet-18, 4 encoder / 7 decoder layers, 8 heads, latent 32,
# lr_backbone 1e-5, weight decay 1e-4, upstream's random 80/20 episode split (seed 1).

execution = "ensemble:0.01"   # evaluation: ACT's temporal ensembling (k = 0.01)
wandb_project = "ecse552"
