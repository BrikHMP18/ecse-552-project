# Method (b): act_deterministic.toml plus target E's action-free videos labelled by the
# unadapted IDM `idm_turned`; their stored actions are never read (R1). Ablation of act_idm_E.toml:
# no episode is dropped.

data_dir = "data/source-deterministic-n300-seed0"
num_episodes = 300
exclude_detours = false

num_epochs = 2000
batch_size = 8
lr = 1e-5
kl_weight = 10
chunk_size = 20
hidden_dim = 512
dim_feedforward = 3200

execution = "ensemble:0.01"
wandb_project = "ecse552"

[[targets]]
dir = "data/E-deterministic-n200-seed500000"
num_episodes = 200
actions = "labels/E-deterministic-idm_turned-seed{seed}"  # {seed} = training seed
