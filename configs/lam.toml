# LAM for method (h) (LAPA, docs/experiments/lapa.md): a VQ latent action model pretrained
# on the videos of the source demos and of the targets A, D and E, read as images only
# (R1). One LAM, shared by the policies of A, D and E. Trains on the train split of each
# collection and keeps the epoch with the lowest validation reconstruction loss.
collections = [
    "data/source-deterministic-n300-seed0",
    "data/A-deterministic-n200-seed100000",
    "data/D-deterministic-n200-seed400000",
    "data/E-deterministic-n200-seed500000",
]

image_size = 128   # the IDM's resolution; the policies use 224
pretrained = true  # ImageNet ResNet-18
epochs = 20
batch_size = 64
lr = 3e-4
weight_decay = 1e-4
seed = 0

codebook = 128     # discrete latent actions
commitment = 0.25  # VQ commitment weight (beta)
latent_dim = 64
