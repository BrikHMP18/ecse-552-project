# Control of idm_dann_D.toml: same mixed batches, no reversed gradient (dann_lambda = 0).
collections = ["data/source-deterministic-n300-seed0", "data/source-turned-n100-seed600000"]
target = "data/D-deterministic-n200-seed400000"

image_size = 128
pretrained = true
epochs = 20
batch_size = 64
lr = 3e-4
weight_decay = 1e-4
seed = 0

dann_lambda = 0.0  # control: the discriminator trains, the features get no domain gradient
dann_gamma = 10
discriminator_hidden = 256
discriminator_lr = 3e-4
