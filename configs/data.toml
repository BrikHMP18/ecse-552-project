# Data, seeds and evaluation protocol, fixed on 8 November 2026 before any result.
#
# Seeds are used in order, failed expert attempts included, so ranges must not overlap.
# The same seed gives the same initial cube and arm state for every object, so validation
# and test rollouts use one range each, shared by all methods and objects.

env_name = "visual-block-cpu-lite-single-task1-v0"

[seeds]
source_demos = 0             # labeled cube demonstrations (train/validation, 80/20 by episode)
source_test = 50_000         # held-out cube demos: IDM test error only, never trained on or selected with
target_A_videos = 100_000    # action-free videos of target A (true actions: oracle (d) and evaluation only)
target_B_videos = 200_000
target_C_videos = 300_000
target_D_videos = 400_000
target_E_videos = 500_000    # added 11 November 2026 (behaviour shift: turned grasp)
source_turned_demos = 600_000  # labeled cube demos with the grasp turned by 90 degrees: IDM training only
validation = 900_000         # rollouts for checkpoint selection and the R2 decision (source only)
test = 1_000_000             # final rollouts: each selected checkpoint once, every object

[collections]
# Project data (decided 10 November 2026): deterministic demonstrations, scene fixed_yaw
# (cube yaw 0) and expert deterministic (no deliberate detours, fixed speed): the collector's defaults.
source = "data/source-deterministic-n300-seed0"
source_test = "data/source-deterministic-test-n50-seed50000"
A = "data/A-deterministic-n200-seed100000"
B = "data/B-deterministic-n200-seed200000"
C = "data/C-deterministic-n200-seed300000"
D = "data/D-deterministic-n200-seed400000"
E = "data/E-deterministic-n200-seed500000"
# Source cube, expert "turned" (every grasp turned by +90 degrees). For the IDM only, so that it
# sees the wrist angles of target E; policies never train on it (docs/experiments/target_E.md).
source_turned = "data/source-turned-n100-seed600000"
# Reference only: stochastic demonstrations, stock OCBench (random_yaw, stochastic); same seeds.
source_stochastic = "data/source-stochastic-n300-seed0"
source_test_stochastic = "data/source-stochastic-test-n50-seed50000"
A_stochastic = "data/A-stochastic-n200-seed100000"

[protocol]
data = "deterministic collections above, for every method and object (10 Nov 2026: original ACT 99% on them, 53% on the stochastic ones)"
policy = "original ACT (third_party/act, unmodified): configs/act_deterministic.toml; robot state zeroed (R3)"
split = "ACT: upstream random 80/20 of episodes (seed 1); IDM: blocks of 10, 8 train / 2 val (data.py)"
checkpoint = "policy_best.ckpt (lowest validation loss) vs policy_last.ckpt"
selection = "higher success on 100 source validation rollouts with temporal ensembling, ties to best"
test = "3 training seeds x 100 test rollouts per method and object; mean, std and 95% CI"
r2_rule = "proposal: 100 source demos if their selected checkpoint reaches >= 80% validation success, else 300 (10 Nov 2026, before the 100-demo result; was 100/200/300)"
r2_decision = "300 source demos for every method (10 Nov 2026: 100 demos reach 37% on validation)"

[hub]
# Public Hugging Face copy of the collections above; training downloads this exact revision.
dataset = "Autobrik/ecse552-ocbench-block"
revision = "b7ef4c6975596a9825585e11f33d385f1fa8681f"  # adds target E and source-turned (11 Nov 2026; oracle E trained from b50de4d, same E); other collections as in f739635 (re-recorded without 90-degree grasp turns, 10 Nov)
