# Data, seeds and evaluation protocol, fixed on 8 November 2026 before any result.
#
# Seeds are used in order, failed expert attempts included, so ranges must not overlap.
# The same seed gives the same initial cube and arm state for every object, so validation
# and test rollouts use one range each, shared by all methods and objects.

env_name = "visual-block-cpu-lite-single-task1-v0"

[seeds]
source_demos = 0             # labeled cube demonstrations (train/validation, 80/20 by episode)
source_test = 50_000         # held-out cube demos: IDM test error only, never trained on or selected with
target_A_videos = 100_000    # action-free videos of target A (true actions: oracle (d) and evaluation only)
target_B_videos = 200_000
target_C_videos = 300_000
target_D_videos = 400_000
validation = 900_000         # rollouts for checkpoint selection and the R2 decision (source only)
test = 1_000_000             # final rollouts: each selected checkpoint once, every object

[collections]
source = "data/source-n300-seed0"
source_test = "data/source-test-n50-seed50000"
A = "data/A-n200-seed100000"

[protocol]
policy = "original ACT (third_party/act, unmodified): configs/act_original.toml; robot state zeroed (R3)"
split = "ACT: upstream random 80/20 of episodes (seed 1); IDM: blocks of 10, 8 train / 2 val (data.py)"
checkpoint = "policy_best.ckpt (lowest validation loss) vs policy_last.ckpt"
selection = "higher success on 100 source validation rollouts with temporal ensembling, ties to best"
test = "3 training seeds x 100 test rollouts per method and object; mean, std and 95% CI"
r2_rule = "smallest of 100, 200, 300 source demos whose selected checkpoint reaches >= 80% validation success; 300 if none"

[hub]
# Public Hugging Face copy of the collections above; training downloads this exact revision.
dataset = "Autobrik/ecse552-ocbench-block"
revision = "aa4e3eecc9b7266f561923be09f848c63cbe3088"
