[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecse-552-project"
version = "0.1.0"
description = "Action-free object transfer through inverse dynamics adaptation."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "einops>=0.8.2",
    "h5py>=3.16.0",
    "ipython>=8.39.0",
    "matplotlib>=3.10.9",
    "ocbench",
    "opencv-python-headless>=5.0.0.93",
    "pillow",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
ocbench = { path = "third_party/ocbench", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/action_free"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", "docs/tools"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
